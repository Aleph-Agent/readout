    <path d="M 59.01 18.94 A 30 30 0 0 1 59.01 45.06 L 49.56 40.49 L 49.56 23.51 Z" />
    <path d="M 56.81 48.86 A 30 30 0 0 1 34.2 61.92 L 33.43 51.45 L 48.13 42.96 Z" />
    <path d="M 29.8 61.92 A 30 30 0 0 1 7.19 48.86 L 15.87 42.96 L 30.57 51.45 Z" />
    <path d="M 7.19 15.14 A 30 30 0 0 1 29.8 2.08 L 30.57 12.55 L 15.87 21.04 Z" />
  </g>

