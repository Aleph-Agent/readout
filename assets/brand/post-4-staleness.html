<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Plex Condensed'; font-weight: 600;
    src: url('../../dist/fonts/ibm-plex-sans-condensed-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 400;
    src: url('../../dist/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Serif'; font-weight: 400;
    src: url('../../dist/fonts/ibm-plex-serif-latin-400-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #121212; color: #e8e8e8; font-family: 'Plex Mono', monospace; overflow: hidden; }

  .eyebrow {
    font-family: 'Plex Condensed', sans-serif; font-weight: 600;
    font-size: 19px; letter-spacing: 0.2em; text-transform: uppercase; color: #9e9e9e;
  }
  /* Tabular figures, always. A column of numbers that shifts as it counts is a
     number nobody trusts, and this is the only thing on the card that matters. */
  .figure {
    font-family: 'Plex Condensed', sans-serif; font-weight: 600;
    font-variant-numeric: tabular-nums; font-size: 190px; line-height: 0.86;
    color: #d2e2f4; letter-spacing: -0.02em;
  }
  .say { font-family: 'Plex Serif', Georgia, serif; font-size: 35px; line-height: 1.5; color: #cfcfcf; }
  .foot {
    position: absolute; left: 76px; right: 76px; bottom: 52px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Plex Condensed', sans-serif; font-weight: 600;
    font-size: 17px; letter-spacing: 0.18em; text-transform: uppercase; color: #6b6b6b;
  }
  .foot .mark { display: flex; align-items: center; gap: 14px; color: #9e9e9e; }
</style>
<style>
  body { width: 1200px; height: 675px; position: relative; }
  /* A hairline under the figure, running the full measure. The card was a
     block of text against three quarters of empty canvas; one rule that spans
     the column turns the space into a margin instead of a gap. */
  .frame { position: absolute; inset: 0; padding: 78px 76px 0; display: flex;
           flex-direction: column; justify-content: center; gap: 30px; padding-bottom: 132px; }
  .rule { border-bottom: 1px solid #2c2c2c; width: 100%; }
  .unit { font-family: 'Plex Condensed', sans-serif; font-weight: 600; font-size: 27px;
          letter-spacing: 0.13em; text-transform: uppercase; color: #9e9e9e; margin-top: 4px; }
  .say { max-width: 44ch; }
</style></head>
<body>
  <div class="frame">
    <span class="eyebrow">Shipped · from the registry, not the repo</span>
    <div>
      <div class="figure">158</div>
      <div class="unit">packages, by real release date</div>
    </div>
    <div class="rule"></div>
    <p class="say">A green commit graph is what a maintainer does for themselves. A release is what reaches you. They are not the same date.</p>
  </div>
  <div class="foot">
    <span class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="30" height="30" role="img" aria-label="Sighttrue">
  <title>Sighttrue</title>

  <!--
    A geometric S on a datum line. Generated by scripts/build-mark.mjs, which
    records the three marks this replaced and why each failed.

    The rules either side are the reference the letter is measured against — the
    "true" in the name. They stop short of the S rather than crossing it,
    because a line through a letter is a strikethrough and a mark that reads as
    its own name crossed out fails in a specific and embarrassing way.
  -->

  <path d="M 42.44 22.6 A 10.5 10.5 0 1 0 32 32 A 10.5 10.5 0 1 1 21.56 43.6" fill="none" stroke="#d2e2f4" stroke-width="9" stroke-linecap="butt" />

  <g stroke="#f2857c" stroke-width="3.4" stroke-linecap="butt">
    <path d="M 2 32 H 13" />
    <path d="M 51 32 H 62" />
  </g>
</svg>
 Sighttrue</span>
    <span>sighttrue.com</span>
  </div>
</body></html>
