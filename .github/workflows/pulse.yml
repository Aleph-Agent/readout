name: Pulse

# Every four hours. The :17 offset avoids the top of the hour, which is the
# most congested window and where scheduled runs are most likely to be dropped.
#
# Four-hourly is the ceiling, not a preference: Cloudflare Pages allows 500
# builds a month and every data refresh needs a deployment. Six runs a day is
# 180. Hourly would be 720 and over the limit.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Collect only the first N repositories (dry run)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

# Pulse and daily both push to the ledger. Queue them instead of racing.
concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    # A job is killed at six hours anyway; an explicit ceiling stops one hung
    # request from burning an hour of wall clock.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Collect
        env:
          # Secret names cannot begin with GITHUB_, so the secret is stored
          # under SIGNAL_GITHUB_PAT and mapped here.
          #
          # This is a fine-grained token with public-repository read access, not
          # the built-in Actions token: that one is capped at 1,000/hour per
          # repository, which is too close to the working budget.
          GITHUB_PAT: ${{ secrets.SIGNAL_GITHUB_PAT }}
        run: node scripts/pulse.ts ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}

      - name: Summarise
        # Never blocks publishing. If Groq is down or out of quota, every event
        # still ships with its raw numbers and no prose — which is the honest
        # rendering anyway. Losing interpretation is not losing measurement.
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/summarise.ts

      - name: Build bundles
        id: build
        run: node scripts/build.ts

      - name: Deploy to Cloudflare Pages
        id: deploy
        # Static assets only. No Workers, no KV, no D1 anywhere near the read
        # path — that is what makes visitor traffic free and uncapped.
        if: steps.build.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=readout --branch=main

      - name: Record deployment
        # Advances the stored hash only on success, so a failed deploy leaves
        # the gate open instead of marking a bundle as shipped that never was.
        if: always() && steps.build.conclusion == 'success'
        run: |
          node scripts/record-deploy.ts \
            --hash='${{ steps.build.outputs.hash }}' \
            --deployed='${{ steps.deploy.conclusion == 'success' }}'

      - name: Commit ledger
        # Runs even when the collection step failed and even when nothing
        # changed. This is load-bearing: scheduled workflows are auto-disabled
        # after 60 days of repository inactivity, and the commit is what keeps
        # that from ever firing. Removing it fails silently, months later.
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "readout-agent"
          git config user.email "readout-agent@users.noreply.github.com"
          git add data
          git commit --allow-empty -m "Pulse $(date -u +'%Y-%m-%dT%H:%MZ')"
          # The concurrency group serialises every ledger writer, so the plain
          # push is the normal path. Checkout is shallow, so only unshallow on
          # the rare race where someone pushed to the branch mid-run.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git fetch --unshallow --quiet origin "${GITHUB_REF_NAME}" \
              || git fetch --quiet origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Open an issue on failure
        # GitHub does not notify on scheduled workflow failure. Without this the
        # agent can be dead for weeks while the site quietly serves stale data.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Pulse failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'agent-failure',
            });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.some((issue) => issue.title === title)) {
              const issue = existing.data.find((i) => i.title === title);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['agent-failure'],
              });
            }
