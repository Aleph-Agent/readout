<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;padding:0}
body{width:400px;height:400px;background:#1c1c1c;display:grid;place-items:center}</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="330" height="330" role="img" aria-label="Sighttrue">
  <title>Sighttrue</title>

  <!--
    A plumb bob over its datum. Generated by scripts/build-mark.mjs, which
    records the four abstract marks this replaced and why each failed.

    The oldest instrument for establishing what is true by measuring it, and the
    phrase carpenters still use — plumb and true — is the name of this product.
    The bob hangs from a line it did not choose and the point either meets the
    datum or it does not: a reading, not an opinion.

    Solid silhouette, one axis of symmetry, no outline. It has to read filled in
    a single flat colour, because that is how it appears on a sticker and in a
    favicon cache.
  -->

  <g fill="#d2e2f4">
    <rect x="30.7" y="4" width="2.6" height="15" />
    <path d="M 27.53 19 L 36.47 19 L 40.6 22.4 L 40.6 29 L 32 53 L 23.4 29 L 23.4 22.4 Z" />
  </g>

  <!-- The reference. In the alert colour because it is the only thing on the
       mark that carries a judgement: the point is either on it or it is not. -->
  <rect x="6" y="56.3" width="52" height="3.4" fill="#f2857c" />
</svg>
