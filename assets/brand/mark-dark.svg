<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sighttrue">
  <title>Sighttrue</title>

  <!--
    A graduated dial with one reading past the rest. Generated by
    scripts/build-mark.mjs, which explains every decision in it.

    The ring is the bar every reading is measured against — the "true" in the
    name. The graduations hang inside it, mostly short, because most of what
    this watches is behaving normally and reporting that honestly is the job.
    The one mark crossing out through the ring is the finding.

    One stroke weight for the graduations, one for the outlier, no gradient and
    no glow. Nothing here is thinner than 2 units, which is 1px at avatar size.
  -->

  <!-- The bar. Thinner and dimmer than the graduations inside it: a reference
       is not a reading and must not compete with one. A closed contour draws
       the eye harder than anything else on a shape this small, so it is held
       well back. -->
  <circle cx="32" cy="32" r="24" fill="none"
          stroke="#5c5c5c" stroke-width="1.1" />

  <g stroke="#d2e2f4" stroke-width="1.7" stroke-linecap="butt">
    <line x1="32" y1="8" x2="32" y2="11" />
    <line x1="36.17" y1="8.36" x2="35.21" y2="13.78" />
    <line x1="40.21" y1="9.45" x2="39.01" y2="12.74" />
    <line x1="44" y1="11.22" x2="42.75" y2="13.38" />
    <line x1="47.43" y1="13.61" x2="42.93" y2="18.98" />
    <line x1="50.39" y1="16.57" x2="48.09" y2="18.5" />
    <line x1="52.78" y1="20" x2="50.62" y2="21.25" />
    <line x1="54.55" y1="23.79" x2="46.1" y2="26.87" />
    <line x1="55.64" y1="27.83" x2="51.7" y2="28.53" />
    <line x1="56" y1="32" x2="53" y2="32" />
    <line x1="55.64" y1="36.17" x2="50.71" y2="35.3" />
    <line x1="54.55" y1="40.21" x2="52.2" y2="39.35" />
    <line x1="52.78" y1="44" x2="49.75" y2="42.25" />
    <line x1="50.39" y1="47.43" x2="44.26" y2="42.28" />
    <line x1="47.43" y1="50.39" x2="45.5" y2="48.09" />
    <line x1="44" y1="52.78" x2="42.75" y2="50.62" />
    <line x1="40.21" y1="54.55" x2="38.67" y2="50.32" />
    <line x1="36.17" y1="55.64" x2="35.56" y2="52.19" />
    <line x1="32" y1="56" x2="32" y2="46.5" />
    <line x1="27.83" y1="55.64" x2="28.35" y2="52.68" />
    <line x1="23.79" y1="54.55" x2="24.65" y2="52.2" />
    <line x1="20" y1="52.78" x2="23" y2="47.59" />
    <line x1="16.57" y1="50.39" x2="19.14" y2="47.32" />
    <line x1="13.61" y1="47.43" x2="15.91" y2="45.5" />
    <line x1="11.22" y1="44" x2="17.71" y2="40.25" />
    <line x1="9.45" y1="40.21" x2="11.8" y2="39.35" />
    <line x1="8.36" y1="36.17" x2="11.81" y2="35.56" />
    <line x1="8" y1="32" x2="13" y2="32" />
    <line x1="8.36" y1="27.83" x2="11.32" y2="28.35" />
    <line x1="9.45" y1="23.79" x2="17.43" y2="26.7" />
    <line x1="13.61" y1="16.57" x2="16.68" y2="19.14" />
    <line x1="16.57" y1="13.61" x2="20.75" y2="18.59" />
    <line x1="20" y1="11.22" x2="21.5" y2="13.81" />
    <line x1="23.79" y1="9.45" x2="24.65" y2="11.8" />
    <line x1="27.83" y1="8.36" x2="28.61" y2="12.8" />
  </g>

  <!-- The one that moved. Wider as well as longer, so it survives being resized
       to sixteen pixels by somebody else's favicon cache. -->
  <line x1="11.22" y1="20" x2="5.15" y2="16.5"
        stroke="#f2857c" stroke-width="2.4" stroke-linecap="butt" />
</svg>
