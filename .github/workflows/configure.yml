name: Configure Pages

# Pushes the answer endpoint's credentials into the Cloudflare Pages project.
#
# Run by hand, and rarely: on first setup, and again if the Groq key is ever
# replaced. It is a separate workflow rather than a step in Pulse because the
# key does not change six times a day, and a deploy token that edits project
# settings should be used as seldom as the thing it configures changes.
#
# Why this exists at all: a Pages Function reads its secrets from the project's
# environment, which is set out of band rather than at deploy time. This is the
# out-of-band step, kept in the repository so it is reproducible and reviewable
# instead of being a thing somebody once did in a dashboard.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-pages
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Put the Groq key in the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY is not set. Nothing to configure." >&2
            exit 1
          fi
          # Piped rather than passed as an argument: an argument is visible in
          # the process list of every other process on the runner.
          printf '%s' "${GROQ_API_KEY}" \
            | npx --yes wrangler@4 pages secret put GROQ_API_KEY --project-name=readout

      - name: Confirm the endpoint reports itself configured
        # Checks the observable behaviour rather than the setting: an
        # unconfigured endpoint answers 503 and says so, so a 400 here — the
        # response to an empty question — is proof the key arrived.
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://readout-7pt.pages.dev/api/ask \
            -H 'content-type: application/json' \
            --data '{"question":""}')
          echo "endpoint answered ${code}"
          if [ "${code}" = "503" ]; then
            echo "Still unconfigured. The secret did not take effect." >&2
            exit 1
          fi
