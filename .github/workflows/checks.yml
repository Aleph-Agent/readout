name: Checks

# Runs on code, not on readings.
#
# The agent commits to data/ six times a day forever. Without the path filter
# this workflow would fire on every one of those, burying real failures in a
# stream of runs that could not possibly fail differently — the code did not
# change. Anything that touches source, tests, config, or workflows still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here writes to the repository or deploys anything; that is
# what the scheduled workflows are for.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after. Some of them assert on what the build
      # emits — the CSP hash against the served bytes, the sitemap against the
      # pages that exist, the account link on every page — and those read dist
      # at import time. Without a build there is no dist, the module throws
      # before a single test registers, and the suite reports zero tests and
      # fails. It did, six runs in a row, while every local run was green
      # because a build had always just happened by hand.
      #
      # The build also catches what no unit test can: a template that throws on
      # real data, a bundle over the size limit, a repository id that is not a
      # safe path.
      - name: Build
        run: node scripts/build.ts

      - name: Tests
        run: npm test
