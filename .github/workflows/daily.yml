name: Daily

# 02:17 UTC. Writes the canonical snapshot and classifies spikes against it.
#
# History is written once a day, not once a pulse. Six snapshots daily would
# multiply repository growth sixfold and buy nothing — a baseline only needs
# daily resolution.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Snapshot, classify, and collect daily signals
        env:
          GITHUB_PAT: ${{ secrets.SIGNAL_GITHUB_PAT }}
        # Roughly 80 issue requests plus one manifest request per active
        # repository — inside the thousand this job is allowed, and far inside
        # the daily ceiling once ETags start answering 304.
        run: node scripts/daily.ts

      - name: Summarise
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/summarise.ts

      - name: Build bundles
        id: build
        run: node scripts/build.ts

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.build.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=readout --branch=main

      - name: Record deployment
        if: always() && steps.build.conclusion == 'success'
        run: |
          node scripts/record-deploy.ts \
            --hash='${{ steps.build.outputs.hash }}' \
            --deployed='${{ steps.deploy.conclusion == 'success' }}'

      - name: Commit ledger
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "readout-agent"
          git config user.email "readout-agent@users.noreply.github.com"
          git add data
          git commit --allow-empty -m "Daily $(date -u +'%Y-%m-%d')"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git fetch --unshallow --quiet origin "${GITHUB_REF_NAME}" \
              || git fetch --quiet origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Daily job failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'agent-failure',
            });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.some((issue) => issue.title === title)) {
              const issue = existing.data.find((i) => i.title === title);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['agent-failure'],
              });
            }
