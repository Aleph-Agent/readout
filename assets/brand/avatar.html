<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sighttrue avatar</title>
<!--
  Rendered to PNG at 2x. See assets/brand/README.md.

  400x400, and the mark has to survive being cropped to a circle by every
  platform that shows it, then shrunk to 32 pixels in a browser tab. That is why
  nothing here is thin and nothing is near the corners.
-->
<style>
  @font-face {
    font-family: 'Plex Condensed';
    src: url('../../dist/fonts/ibm-plex-sans-condensed-latin-600-normal.woff2') format('woff2');
    font-weight: 600;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 400px;
    height: 400px;
    background: #0a0d07;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* The ground is not flat. A faint graticule behind the mark says instrument
     before the mark itself is read, and disappears entirely once the avatar is
     shrunk — which is correct, because at 32px it would only be noise. */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(#1d2317 1px, transparent 1px) 0 0 / 100% 40px,
      linear-gradient(90deg, #1d2317 1px, transparent 1px) 0 0 / 40px 100%;
  }

  svg { position: relative; width: 232px; height: 232px; }
</style>
</head>
<body>
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#ccff00" stroke-width="3.5" stroke-linecap="square">
      <path d="M26 6 V58" />
      <path d="M4 26 H14" />
      <path d="M38 26 H60" />
      <circle cx="26" cy="26" r="12" />
    </g>
    <circle cx="26" cy="26" r="3" fill="#ccff00" />
  </svg>
</body>
</html>
