<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sighttrue banner</title>
<!--
  GENERATED by scripts/build-brand.mjs. Do not edit by hand.

  One sentence, not a stat sheet. The previous banner led with four figures and
  read as a summary of somebody else's GitHub — which is exactly the objection
  this product has to answer, printed across the top of the profile.

  A header gets three seconds. A sentence that makes a developer think "wait,
  that is true of my project" beats four numbers they have no context for.

  Laid out for what X does to a header: the avatar covers the bottom-left, so
  nothing that must be read goes there, and mobile crops to the middle band.
-->
<style>

    src: url('../../dist/fonts/ibm-plex-serif-latin-400-normal.woff2') format('woff2'); }

  body { width: 1500px; height: 500px; background: #121212; color: #e8e8e8;

           display: flex; flex-direction: column; justify-content: center; padding-bottom: 96px; }

  .foot { position: absolute; left: 82px; right: 82px; bottom: 42px;
          display: flex; justify-content: space-between;

          letter-spacing: 0.18em; text-transform: uppercase; color: #6b6b6b; }
</style></head>
<body>
  <div class="frame">
    <p class="say">A dependency you already ship changed its licence, and
    <b>nobody told you.</b></p>
  </div>
  <div class="lockup">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="132" height="132" role="img" aria-label="Sighttrue">
  <title>Sighttrue</title>

  <!--
    A plumb bob over its datum. Generated by scripts/build-mark.mjs, which
    records the four abstract marks this replaced and why each failed.

    The oldest instrument for establishing what is true by measuring it, and the
    phrase carpenters still use — plumb and true — is the name of this product.
    The bob hangs from a line it did not choose and the point either meets the
    datum or it does not: a reading, not an opinion.

    Solid silhouette, one axis of symmetry, no outline. It has to read filled in
    a single flat colour, because that is how it appears on a sticker and in a
    favicon cache.
  -->

  <g fill="#d2e2f4">
    <rect x="30.7" y="4" width="2.6" height="15" />
    <path d="M 27.53 19 L 36.47 19 L 40.6 22.4 L 40.6 29 L 32 53 L 23.4 29 L 23.4 22.4 Z" />
  </g>

  <!-- The reference. In the alert colour because it is the only thing on the
       mark that carries a judgement: the point is either on it or it is not. -->
  <rect x="6" y="56.3" width="52" height="3.4" fill="#f2857c" />
</svg>

    <span class="wm">sighttrue</span>
  </div>
  <div class="foot">
    <span>sighttrue.com &middot; @Sighttruehq</span>
    <span>388 repositories &middot; read every 4 hours</span>
